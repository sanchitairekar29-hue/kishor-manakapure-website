<!DOCTYPE html>

    <link

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        <h2>किशोर माणकापुरे</h2>

        <a href="/contact">संपर्क</a>

</nav>


<!-- GALLERY HERO -->

<section class="books-hero">

    <div class="hero-overlay">

        <h1>फोटो गॅलरी</h1>

        <div class="gallery-card">
            <img
                src="{{ url_for('static', filename='images/book3.jpg') }}"

            >
        </div>

        <div class="gallery-card">
            <img
                src="{{ url_for('static', filename='images/book4.jpg') }}"
